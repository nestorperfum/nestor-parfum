<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestor Parfum</title>
<style>
:root{--bg:#F7F5F0;--ink:#101010;--card:#fff;--gold:#C9A45C;--dark:#292929;--line:#e3ddd0;--muted:#6b665c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101010;--ink:#F7F5F0;--card:#1b1b1b;--line:#333;--muted:#a9a396}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#101010;color:#F7F5F0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#101010;z-index:10}
.logo{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--gold);letter-spacing:2px;font-size:15px}
.coin{width:76px;height:75px;perspective:500px;flex:none}
.sp{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 9s linear infinite}
.sp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sp .b{transform:rotateY(180deg) translateZ(4px)}.sp .f{transform:translateZ(4px)}
.sp .e{filter:brightness(.35) sepia(1) saturate(3);backface-visibility:visible}
@keyframes spin{to{transform:rotateY(360deg)}}
@media (max-width:520px){.coin{width:56px;height:55px}.lt{display:none}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a,.btn{background:none;border:0;color:inherit;padding:8px 10px;cursor:pointer;text-decoration:none;font-size:14px}
nav a:hover{color:var(--gold)}
.btn{background:var(--gold);color:#101010;border-radius:6px;font-weight:bold;min-height:40px}
.btn.alt{background:transparent;border:1px solid var(--gold);color:var(--ink)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.red{background:#8b2b2b;color:#fff}
header input{padding:8px;border-radius:6px;border:1px solid #444;background:#1b1b1b;color:#fff;min-width:0;flex:1 1 140px}
main{max-width:1100px;margin:0 auto;padding:14px}
.hero{background:linear-gradient(120deg,#101010,#292929);color:#F7F5F0;border-radius:12px;padding:34px 20px;margin-bottom:16px}
.hero h1{margin:0 0 8px;color:var(--gold);font-weight:normal;font-size:clamp(24px,5vw,40px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--gold);background:transparent;border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--gold);color:#101010}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ph{aspect-ratio:1;border-radius:8px;background:#292929 center/cover;display:grid;place-items:center;color:var(--gold);font-size:30px}
.tag{font-size:11px;background:var(--gold);color:#101010;border-radius:4px;padding:1px 6px;align-self:flex-start}
.muted{color:var(--muted);font-size:13px}.price{font-size:18px;color:var(--gold);font-weight:bold}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;cursor:pointer;font-size:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}.box{background:var(--bg);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
label{display:block;font-size:13px;margin-top:8px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.wrap{overflow-x:auto}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{display:block;font-size:26px;color:var(--gold)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.demo{background:#fff3cd;color:#5a4500;padding:6px 10px;font-size:12px;text-align:center}

:root,:root:not([data-theme=light]){--bg:#0b0b0b;--ink:#F7F5F0;--card:#141414;--line:#3a2f18;--muted:#a9a396}
nav a:first-child{background:var(--gold);color:#101010;border-radius:99px;font-weight:bold}
header input{border-radius:99px;border-color:#5a4620;padding:9px 14px}
.hero2{position:relative;overflow:hidden;border-radius:14px;margin-bottom:14px;padding:34px 22px;min-height:340px;display:grid;grid-template-columns:1.1fr .9fr;gap:10px;align-items:center;border:1px solid #3a2f18;background:radial-gradient(ellipse at 78% 62%,#c9a45c66,transparent 55%),radial-gradient(ellipse at 8% 18%,#c9a45c3a,transparent 45%),radial-gradient(ellipse at 40% 100%,#c9a45c22,transparent 50%),linear-gradient(120deg,#050505,#1a1408 60%,#0b0b0b)}
.hero2 h1{font-weight:normal;font-size:clamp(32px,6vw,58px);line-height:1.05;margin:6px 0 10px}.hero2 em{color:var(--gold)}
.kick{letter-spacing:4px;color:var(--gold);font-size:14px}
.bots{display:flex;justify-content:center;align-items:flex-end;gap:8px}.bots svg{width:min(34vw,190px);filter:drop-shadow(0 0 22px #c9a45caa)}.bots svg+svg{width:min(26vw,140px)}
@media(max-width:700px){.hero2{grid-template-columns:1fr;padding:24px 16px}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}@media(min-width:800px){.tiles{grid-template-columns:repeat(7,1fr)}}
.tile{border:1px solid #5a4620;background:linear-gradient(#1a1a1a,#0d0d0d);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--ink);font-size:13px}.tile b{display:block;font-size:24px;color:var(--gold)}.tile.on{border-color:var(--gold);box-shadow:0 0 12px #c9a45c66}
.sec{font-weight:normal;display:inline-block;border-bottom:2px solid var(--gold);padding-bottom:4px}
.pubchips{display:none}
.card{border-color:#5a4620;background:linear-gradient(#1a1a1a,#0b0b0b)}
.ph{background:radial-gradient(circle at 50% 65%,#c9a45c55,#0b0b0b 72%) center/cover;padding:10px}.ph svg{height:100%;width:auto;max-width:100%}
.wafab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;background:#16a34a;color:#fff;border-radius:99px;padding:12px 18px;font-family:Arial,sans-serif;font-weight:bold;text-decoration:none;box-shadow:0 4px 18px #000a}

html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}img,svg{max-width:100%}
#adm{display:none}.admb{color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:8px 14px;font-size:13px;text-decoration:none;white-space:nowrap;font-family:Arial,sans-serif;order:2}.admb:hover{background:var(--gold);color:#101010}
main{max-width:1240px;padding-bottom:90px}
.btn,.chip,.tile,.qty button{touch-action:manipulation}
@media(max-width:700px){
 body{font-size:15px}
 .demo{font-size:11px;padding:4px 8px}
 header{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px}
 header .logo{order:1;flex:1}header>.btn{order:2;min-height:44px;padding:6px 14px}
 header #q{order:3;flex:1 1 100%;min-height:42px;font-size:16px}
 header nav{order:4;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 header nav a{white-space:nowrap;padding:8px 12px;font-size:14px}
 main{padding:10px 10px 90px}
 .hero2{min-height:0;padding:20px 14px;text-align:left}
 .hero2 h1{font-size:30px}.hero2 p{font-size:14px;margin:0 0 12px}
 .bots{margin-top:6px}.bots svg{width:34vw;max-width:150px}.bots svg+svg{width:24vw;max-width:105px}
 .tiles{gap:6px}.tile{font-size:12px;padding:9px 2px}.tile b{font-size:21px}
 .sec{font-size:20px;margin:6px 0 10px}
 .grid{gap:10px}.card{padding:8px;gap:5px}.card b{font-size:14px;line-height:1.25}
 .card .price{font-size:17px}.card .muted{font-size:12px}
 .card .btn{min-height:42px;font-size:13px;padding:6px}
 .qty button{width:38px;height:38px}
 .box{padding:14px;border-radius:12px}.box table{font-size:13px}
 input,select,textarea{font-size:16px}
 .kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:22px}
 .wafab{padding:10px 14px;font-size:14px;right:10px}
 footer{padding-bottom:70px}
}
@media(min-width:1000px){header{padding:10px 28px}.hero2{min-height:400px;padding:44px 40px}.bots svg{width:230px}.bots svg+svg{width:165px}}
.card{position:relative}.nuevo{position:absolute;top:14px;right:14px;z-index:1;background:var(--gold);color:#101010;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:bold;font-family:Arial,sans-serif}
.showbox{position:relative;border-radius:14px;overflow:hidden;border:1px solid #5a4620;box-shadow:0 0 30px #c9a45c55;aspect-ratio:9/13;width:100%;max-width:340px;margin-inline:auto;background:#000}
.showbox video,.showbox img{width:100%;height:100%;object-fit:cover;object-position:50% 75%;display:block}
@media(max-width:700px){.showbox{max-width:290px}}@media(min-width:1000px){.showbox{max-width:400px}}
.showbox{border:0;box-shadow:none;background:none;aspect-ratio:auto;max-width:470px;height:390px;overflow:visible;position:relative}
.stage{position:relative;width:100%;height:100%;perspective:1000px;perspective-origin:50% 40%;--R:clamp(95px,30vw,160px);--hs:clamp(150px,44vw,215px);--hc:clamp(190px,56vw,265px)}
.orb{position:absolute;inset:0;transform-style:preserve-3d;animation:orb 14s linear infinite}
.arm,.mid{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d}
.a1{transform:translateZ(var(--R))}.a2{transform:rotateY(180deg) translateZ(var(--R))}
.pf{transform-style:preserve-3d}.mid.pf{animation:cn1 14s linear infinite}.p1{animation:cn1 14s linear infinite}.p2{animation:cn2 14s linear infinite}
.pf img{position:absolute;left:0;top:0;height:var(--hs);width:auto;max-width:none;transform:translate(-50%,-50%);filter:drop-shadow(0 10px 14px #000c)}
.mid img{height:var(--hc)}
.pod{position:absolute;left:6%;right:6%;bottom:4%;height:15%;border-radius:50%;background:radial-gradient(ellipse at center,#f0d68a 0,#8a6a2b 55%,transparent 72%);box-shadow:0 0 50px #c9a45caa}
@keyframes orb{to{transform:rotateY(360deg)}}
@keyframes cn1{from{transform:rotateY(0)}to{transform:rotateY(-360deg)}}
@keyframes cn2{from{transform:rotateY(-180deg)}to{transform:rotateY(-540deg)}}
@media(max-width:700px){.showbox{height:340px;max-width:100%}}
@media(prefers-reduced-motion:reduce){.orb,.pf{animation:none!important}.a1{transform:translateX(calc(var(--R)*-.9))}.a2{transform:translateX(calc(var(--R)*.9))}.p2{transform:none}}
.admb{display:inline-block}
.tabbar{display:none}
@media(max-width:700px){.tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;background:#0b0b0b;border-top:1px solid #5a4620;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.tabbar button{flex:1;background:none;border:0;color:var(--ink);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;cursor:pointer}.tabbar b{font-size:20px;font-weight:normal;color:var(--gold)}.wafab{display:none}main{padding-bottom:100px}footer{padding-bottom:90px}}
</style></head><body>
<div class="demo">Versión 1 · productos marcados “DEMO” son ejemplos; reemplázalos por los reales desde el panel.</div>
<header>
 <div class="logo" onclick="logoTap()"><div class="coin" role="img" aria-label="Logo Nestor Parfum"><div class="sp" id="sp"></div></div><span class="lt">NESTOR PARFUM</span></div>
 <nav id="nav"><a href="#" onclick="go('');return false">Inicio</a><a href="#cat" onclick="go('cat');return false">Catálogo</a><a href="#" onclick="go('cat','Ofertas');return false">Ofertas</a><a href="#may" onclick="go('may');return false">Mayoristas</a><a href="#ct" onclick="go('ct');return false">Contacto</a><a href="#admin" id="adm" style="opacity:.5">Admin</a></nav>
 <input id="q" type="search" placeholder="Buscar perfume…" aria-label="Buscar">
 <a href="#admin" class="admb">⚙ Administrar</a><button class="btn" onclick="openCart()" aria-label="Carrito">🛒 <span id="cn">0</span></button>
</header>
<main id="app"></main>
<footer>© Nestor Parfum</footer>

<div class="modal" id="m"><div class="box" id="mb"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DB;
const DEF={v:2,cfg:{wa:'',was:['','','',''],cur:'$',low:5,pass:''},cats:['Hombre','Mujer','Unisex','Árabes','Más vendidos','Ofertas'],
products:[
{sku:'DEMO-001',name:'Oud Noir',brand:'Marca Demo',cat:'Hombre',size:'100 ml',desc:'Amaderado intenso con oud y ámbar.',detal:50,mayor:40,min:6,stock:20,active:true,cashea:{},img:'',demo:true,col:'#111',new:true},
{sku:'DEMO-002',name:'Rosa Imperial',brand:'Marca Demo',cat:'Mujer',size:'75 ml',desc:'Floral elegante con rosa y vainilla.',detal:60,mayor:48,min:6,stock:3,active:true,cashea:{1:70,2:68},img:'',demo:true,col:'#3a0f1d',new:true},
{sku:'DEMO-003',name:'Ámbar Royal',brand:'Marca Demo',cat:'Árabes',size:'100 ml',desc:'Ámbar dulce y especiado, de larga duración.',detal:45,mayor:0,min:0,stock:12,active:true,cashea:{},img:'',demo:true,col:'#1a1405',new:false},
{sku:'DEMO-004',name:'Noir Absolu',brand:'Marca Demo',cat:'Unisex',size:'90 ml',desc:'Cítrico fresco con fondo de maderas.',detal:55,mayor:44,min:6,stock:15,active:true,cashea:{},img:'',demo:true,col:'#0e1a2a',new:false},
{sku:'DEMO-005',name:'Gold Intense',brand:'Marca Demo',cat:'Hombre',size:'100 ml',desc:'Especiado y cálido, carácter marcado.',detal:48,mayor:0,min:0,stock:0,active:true,cashea:{},img:'',demo:true,col:'#111',new:false},
{sku:'DEMO-006',name:'Vanille Étoile',brand:'Marca Demo',cat:'Mujer',size:'75 ml',desc:'Vainilla suave con flores blancas.',detal:58,mayor:46,min:6,stock:9,active:true,cashea:{},img:'',demo:true,col:'#2a1a2a',new:false}],
orders:[],moves:[],log:[]};
try{DB=JSON.parse(localStorage.getItem('nestor_db'))}catch(e){}
DB=DB||structuredClone(DEF);DB.cfg.was=DB.cfg.was||[DB.cfg.wa||'','','',''];if(!DB.v){DB.products=DB.products.filter(p=>!p.demo).concat(DEF.products);DB.v=2;}
const save=()=>{try{localStorage.setItem('nestor_db',JSON.stringify(DB))}catch(e){}};
let cart=[],fcat='',pay='detal',lvl='',custName='',payForm='',payOther='';
const money=n=>DB.cfg.cur+Number(n).toFixed(2);
const P=sku=>DB.products.find(p=>p.sku===sku);
const status=p=>!p.active?'Desactivado':(p.stock<=0||p.soldOut)?'Agotado':p.stock<=DB.cfg.low?'Stock bajo':'Disponible';
function unit(p,q){ // devuelve precio unitario o null
 if(pay==='cashea'){const v=p.cashea?.[lvl];return v>0?v:null}
 return((pay==='mayor'||(pay==='auto'&&p.min>0))&&p.mayor>0&&q>=(p.min||1))?p.mayor:p.detal}
function go(s,c){location.hash='';if(c!==undefined)fcat=c;else if(!s||s==='')fcat='';render();if(s)setTimeout(()=>document.getElementById(s)?.scrollIntoView(),30);else scrollTo(0,0)}
$('#q').oninput=()=>{if(!location.hash.startsWith('#admin'))render()};
function render(){
 if(location.hash.startsWith('#admin')){return adminView()}
 const q=$('#q').value.toLowerCase();
 const list=DB.products.filter(p=>p.active&&(!fcat||p.cat===fcat)&&(p.name+p.brand+p.cat).toLowerCase().includes(q));
 $('#app').innerHTML=`<section class="hero2"><div><div class="kick">NESTOR PARFUM</div><h1>El aroma que define <em>tu estilo.</em></h1><p>Perfumes originales, al mayor y al detal.</p><button class="btn" onclick="go('cat')">Explorar Catálogo ›</button></div><div class="showbox" id="showbox"></div></section><div class="tiles">${[['','Todos','◆'],...DB.cats.map(c=>[c,c,IC[c]||'✦'])].map(t=>`<button class="tile ${fcat===t[0]?'on':''}" onclick="fcat='${esc(t[0])}';render()"><b>${t[2]}</b>${esc(t[1])}</button>`).join('')}</div>
 <h2 id="cat" class="sec">👑 Perfumes Destacados</h2><div class="chips pubchips"><button class="chip ${!fcat?'on':''}" onclick="fcat='';render()">Todos</button>${DB.cats.map(c=>`<button class="chip ${fcat===c?'on':''}" onclick="fcat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
 <div class="grid">${list.map(card).join('')||'<p>No hay perfumes que coincidan.</p>'}</div>
 <section class="panel" id="may" style="margin-top:18px"><h2>Mayoristas</h2><p>Cada perfume puede tener precio mayorista a partir de un mínimo de unidades. Lo verás indicado en la ficha y se aplica solo en el carrito al llegar a la cantidad.</p></section>
 <section class="panel" id="ct"><h2>Contacto</h2><p>${pickWA()?`<a href="https://wa.me/${esc(pickWA())}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>`:'Número de WhatsApp pendiente de configurar.'}</p></section>`;
 list.forEach(p=>upd(p.sku));mountShow();
}
const qs={};
function card(p){const st=status(p);return`<div class="card"><div class="ph" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':bottle(p.col)}</div>
 ${p.new?'<span class="nuevo">Nuevo</span>':''}${p.demo?'<span class="tag">DEMO</span>':''}<b>${esc(p.name)}</b><span class="muted">${esc(p.brand)} · ${esc(p.cat)} · ${esc(p.size)}</span>
 <span class="muted">${esc(p.desc)}</span><span class="price">${money(p.detal)}</span>
 ${p.mayor>0&&p.min>0?`<span class="muted">Mayor: ${money(p.mayor)} desde ${p.min} uds</span>`:''}
 <span class="muted">${st}</span>
 <div class="qty"><button aria-label="Menos" onclick="ch('${p.sku}',-1)">−</button><b id="q_${p.sku}">1</b><button aria-label="Más" onclick="ch('${p.sku}',1)">+</button></div>
 <span class="muted" id="s_${p.sku}"></span>
 <button class="btn" ${(p.stock<=0||p.soldOut)?'disabled':''} onclick="add('${p.sku}')">${(p.stock<=0||p.soldOut)?'Agotado':'Agregar al carrito'}</button></div>`}
function ch(s,d){qs[s]=Math.max(1,(qs[s]||1)+d);upd(s)}
function upd(s){const p=P(s),q=qs[s]||1;const e=$('#q_'+s);if(!e)return;e.textContent=q;const saved=pay;pay='auto';$('#s_'+s).textContent='Subtotal: '+money(unit(p,q)*q);pay=saved}
function add(s){const p=P(s),q=qs[s]||1;const it=cart.find(c=>c.sku===s);const tot=(it?.q||0)+q;
 if(tot>p.stock){alert(`Stock insuficiente. Disponible: ${p.stock}`);return}
 it?it.q=tot:cart.push({sku:s,q});qs[s]=1;upd(s);cn();openCart()}
const cn=()=>{const n=cart.reduce((a,c)=>a+c.q,0);$('#cn').textContent=n;const c2=$('#cn2');if(c2)c2.textContent=n};
function modal(h){$('#mb').innerHTML=h;$('#m').classList.add('on')}
const closeM=()=>$('#m').classList.remove('on');
$('#m').onclick=e=>{if(e.target.id==='m')closeM()};
function calc(){let tot=0,needs=false,mayor=false;const rows=cart.map(c=>{const p=P(c.sku);const u=unit(p,c.q);if(u===null)needs=true;else if(pay!=='cashea'&&u===p.mayor&&p.mayor>0&&u<p.detal)mayor=true;return{p,c,u,sub:u===null?null:u*c.q}});
 rows.forEach(r=>{if(r.sub!==null)tot+=r.sub});return{rows,tot,needs,mayor}}
function openCart(){
 if(!cart.length){modal('<h3>Tu carrito está vacío</h3><button class="btn" onclick="closeM()">Seguir comprando</button>');return}
 const{rows,tot,needs}=calc();
 modal(`<h3>Carrito</h3><div class="wrap"><table>${rows.map(r=>`<tr><td>${esc(r.p.name)}<br><span class="muted">${r.u===null?'Consultar precio por WhatsApp':money(r.u)+' c/u'}</span></td>
 <td><div class="qty"><button onclick="cq('${r.p.sku}',-1)">−</button>${r.c.q}<button onclick="cq('${r.p.sku}',1)">+</button></div></td>
 <td>${r.sub===null?'—':money(r.sub)}</td><td><button class="btn sm red" aria-label="Quitar" onclick="rm('${r.p.sku}')">✕</button></td></tr>`).join('')}</table></div>
 <p><b>Total estimado: ${money(tot)}</b>${needs?' (+ productos por consultar)':''}<br><span class="muted">Sujeto a confirmación de disponibilidad y condiciones.</span></p>
 <label>Tipo de compra<select id="pm" onchange="setPay(this.value)"><option value="detal" ${pay==='detal'?'selected':''}>Al detal</option><option value="mayor" ${pay==='mayor'?'selected':''}>Al mayor</option><option value="cashea" ${pay==='cashea'?'selected':''}>Cashea</option></select></label>${pay==='mayor'?'<p class="muted">El precio al mayor aplica en los perfumes que lo tienen y al llegar a su mínimo de unidades.</p>':''}
 ${pay==='cashea'?`<p class="muted">Nivel Cashea: <b>${lvl==='consultar'?'Consultar por WhatsApp':lvl||'sin elegir'}</b> <button class="btn sm alt" onclick="casheaModal()">Cambiar</button></p>`:''}
 <label>Método de pago<select id="pf" onchange="payForm=this.value;openCart()"><option value="">Elige cómo pagar</option>${['Binance','Zelle','Pago Móvil','Otro'].map(o=>`<option value="${o}" ${payForm===o?'selected':''}>${o==='Otro'?'Otro tipo de pago':o}</option>`).join('')}</select></label>${payForm==='Otro'?`<label>¿Con qué deseas pagar?<input id="po" value="${esc(payOther)}" oninput="payOther=this.value" placeholder="Escribe tu método de pago"></label>`:''}<p class="muted">Tenemos todo tipo de pago. Si deseas pagar de otra forma, elige “Otro tipo de pago” y escríbelo.</p><label>Tu nombre<input id="nm" autocomplete="name" value="${esc(custName)}" oninput="custName=this.value"></label>
 <div class="row" style="margin-top:12px"><button class="btn alt" onclick="closeM()">Seguir comprando</button><button class="btn" onclick="send()">Enviar pedido por WhatsApp</button></div>`)}
function setPay(v){pay=v;if(v==='cashea'&&!lvl){casheaModal();return}openCart()}
function casheaModal(){modal(`<h3>¿Quieres pagar con Cashea?</h3><p class="muted">Elige tu nivel. El precio mostrado es el configurado por la tienda; las condiciones se confirman por WhatsApp.</p><div class="lv">${[1,2,3,4,5,6].map(n=>`<button class="btn alt" onclick="lvl='${n}';pay='cashea';openCart()">Nivel ${n}</button>`).join('')}</div><button class="btn alt" style="width:100%" onclick="lvl='consultar';pay='cashea';openCart()">No sé mi nivel / consultar por WhatsApp</button><p><button class="btn sm" onclick="pay='detal';openCart()">No, pagar normal</button></p>`)}
function cq(s,d){const it=cart.find(c=>c.sku===s),p=P(s);const n=it.q+d;if(n<1)return rm(s);if(n>p.stock){alert('Stock insuficiente. Disponible: '+p.stock);return}it.q=n;cn();openCart()}
function rm(s){cart=cart.filter(c=>c.sku!==s);cn();cart.length?openCart():closeM()}
function pickWA(){const a=(DB.cfg.was||[]).filter(Boolean);return a.length?a[Math.floor(Math.random()*a.length)]:''}
function send(){
 for(const c of cart){const p=P(c.sku);if(!p||c.q>p.stock){alert('No hay stock suficiente de '+(p?.name||c.sku)+'. Ajusta la cantidad.');return}}
 const wa=pickWA();if(!wa){alert('La tienda aún no tiene número de WhatsApp configurado.');return}
 if(pay==='cashea'&&!lvl){casheaModal();return}
 const{rows,tot,mayor}=calc();const name=$('#nm').value.trim();
 const method=pay==='cashea'?'Cashea':pay==='mayor'?'Al mayor':'Al detal';const fp=payForm==='Otro'?(payOther.trim()||'Otro (por confirmar)'):(payForm||'Por confirmar');
 const lines=rows.map(r=>`- ${r.p.name} (${r.p.sku}) x${r.c.q}: ${r.sub===null?'consultar precio':money(r.sub)}`).join('\n');
 const msg=`Hola, Nestor Parfum. Quiero realizar este pedido${name?' a nombre de '+name:''}:\n${lines}\nTotal estimado: ${money(tot)}.\nTipo de compra: ${method}.\nMétodo de pago: ${fp}.${pay==='cashea'?`\nNivel Cashea: ${lvl==='consultar'?'consultar':lvl}.`:''}\nPor favor, confirma disponibilidad, precio aplicable y condiciones. Gracias.`;
 DB.orders.push({id:Date.now(),date:new Date().toISOString(),name,method,form:fp,lvl:pay==='cashea'?lvl:'',items:rows.map(r=>({sku:r.p.sku,name:r.p.name,q:r.c.q,u:r.u,sub:r.sub})),total:tot,state:'preparado',note:'',deducted:false});save();
 window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
 modal('<h3>Mensaje preparado</h3><p>Se abrió WhatsApp con tu pedido. Revísalo y envíalo desde allí; la tienda lo confirmará contigo.</p><button class="btn" onclick="closeM()">Cerrar</button>');}

let auth=false,tab='Dashboard';
const TABS=['Dashboard','Productos','Inventario','Pedidos','Categorías','Exhibición','Configuración'];
function adminView(){
 const a=$('#app');
 if(!auth){const first=!DB.cfg.pass;
  a.innerHTML=`<div class="panel" style="max-width:380px;margin:30px auto"><h2>Panel administrador</h2><label>${first?'Crea tu contraseña (mín. 6)':'Contraseña'}<input type="password" id="pw"></label><p><button class="btn" onclick="login()">${first?'Crear y entrar':'Entrar'}</button></p><p class="muted">Versión 1: la contraseña vive en este navegador. Para uso real se necesita servidor (ver notas).</p></div>`;return}
 a.innerHTML=`<div class="chips">${TABS.map(t=>`<button class="chip ${tab===t?'on':''}" onclick="tab='${t}';adminView()">${t}</button>`).join('')}<button class="chip" onclick="auth=false;go('')">Salir</button></div><div id="av"></div>`;
 ({Dashboard:dash,Productos:prods,Inventario:inv,Pedidos:ords,'Categorías':cats,'Exhibición':showAdm,'Configuración':conf})[tab]();
}
async function h(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('np:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const v=$('#pw').value;if(v.length<6){alert('Mínimo 6 caracteres');return}const x=await h(v);
 if(!DB.cfg.pass){DB.cfg.pass=x;save();auth=true}else if(DB.cfg.pass===x)auth=true;else{alert('Contraseña incorrecta');return}try{localStorage.setItem('np_owner','1')}catch(e){}document.body.classList.add('owner');adminView()}
function logA(t){DB.log.push({d:new Date().toISOString(),t});save()}
function dash(){const P_=DB.products;const sold=DB.orders.filter(o=>o.state==='confirmado'||o.state==='entregado');const vt=sold.reduce((a,o)=>a+o.total,0),ct=sold.reduce((a,o)=>a+o.items.reduce((b,i)=>b+(i.cost||0)*i.q,0),0),invv=P_.reduce((a,p)=>a+p.stock*(p.cost||0),0);
 $('#av').innerHTML=`<div class="kpis"><div class="kpi">Productos<b>${P_.length}</b></div><div class="kpi">Unidades<b>${P_.reduce((a,p)=>a+p.stock,0)}</b></div><div class="kpi">Pedidos<b>${DB.orders.length}</b></div><div class="kpi">Stock bajo<b>${P_.filter(p=>p.active&&p.stock>0&&p.stock<=DB.cfg.low).length}</b></div><div class="kpi">Agotados<b>${P_.filter(p=>status(p)==='Agotado').length}</b></div></div><div class="kpis" style="margin-top:10px"><div class="kpi">Ventas confirmadas<b>${money(vt)}</b></div><div class="kpi">Costo de lo vendido<b>${money(ct)}</b></div><div class="kpi">Ganancia<b>${money(vt-ct)}</b></div><div class="kpi">Inversión en inventario<b>${money(invv)}</b></div></div><p class="muted">Las ventas cuentan pedidos confirmados o entregados. La ganancia usa el costo unitario que pongas en cada producto.</p>
 ${P_.some(p=>p.demo)?`<p class="muted">Incluye ${P_.filter(p=>p.demo).length} productos DEMO. <button class="btn sm alt" onclick="if(confirm('¿Borrar productos DEMO?')){DB.products=DB.products.filter(p=>!p.demo);save();adminView()}">Quitar demos</button></p>`:''}
 <div class="panel"><b>Movimientos recientes</b>${movTable(DB.moves.slice(-8).reverse())}</div>`}
function movTable(m){return m.length?`<div class="wrap"><table><tr><th>Fecha</th><th>SKU</th><th>Antes</th><th>Cambio</th><th>Final</th><th>Tipo</th><th>Motivo</th></tr>${m.map(x=>`<tr><td>${new Date(x.d).toLocaleString()}</td><td>${esc(x.sku)}</td><td>${x.a}</td><td>${x.c>0?'+':''}${x.c}</td><td>${x.f}</td><td>${esc(x.t)}</td><td>${esc(x.r)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Sin movimientos.</p>'}
function mv(p,c,t,r){const a=p.stock;p.stock=a+c;DB.moves.push({d:new Date().toISOString(),sku:p.sku,a,c,f:p.stock,t,r,u:'admin'})}
function prods(){$('#av').innerHTML=`<button class="btn" onclick="pform()">+ Nuevo producto</button><div class="wrap panel" style="margin-top:10px"><table><tr><th>SKU</th><th>Nombre</th><th>Detal</th><th>Stock</th><th>Estado</th><th></th></tr>${DB.products.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${money(p.detal)}</td><td>${p.stock}</td><td>${status(p)}</td><td><button class="btn sm alt" onclick="pform('${p.sku}')">Editar</button></td></tr>`).join('')}</table></div>`}
function pform(s){const p=s?P(s):{sku:'',name:'',brand:'',cat:DB.cats[0],size:'',desc:'',detal:0,mayor:0,min:0,stock:0,active:true,cashea:{},img:''};
 const f=(id,l,v,t='text')=>`<label>${l}<input id="f_${id}" type="${t}" value="${esc(v)}" ${t==='number'?'min="0" step="0.01"':''}></label>`;
 modal(`<h3>${s?'Editar':'Nuevo'} producto</h3>${f('sku','SKU único',p.sku)}${f('name','Nombre',p.name)}${f('brand','Marca',p.brand)}
 <label>Categoría<select id="f_cat">${DB.cats.map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>${f('size','Presentación',p.size)}
 <label>Descripción<textarea id="f_desc">${esc(p.desc)}</textarea></label>${f('detal','Precio detal',p.detal,'number')}${f('mayor','Precio mayorista',p.mayor,'number')}${f('min','Mínimo mayorista (uds)',p.min,'number')}${f('cost','Costo unitario (lo que invertiste)',p.cost||0,'number')}${s?'':f('stock','Stock inicial',p.stock,'number')}
 <label>Imagen<input type="file" id="f_file" accept="image/*"></label>
 <b>Precios Cashea (vacío = consultar)</b><div class="lv">${[1,2,3,4,5,6].map(n=>`<label>Nivel ${n}<input type="number" min="0" step="0.01" id="f_c${n}" value="${p.cashea?.[n]||''}"></label>`).join('')}</div>
 <label><input type="checkbox" id="f_so" style="width:auto" ${p.soldOut?'checked':''}> Marcar como agotado (aunque haya stock)</label><label><input type="checkbox" id="f_act" style="width:auto" ${p.active?'checked':''}> Activo (visible en catálogo)</label>
 <div class="row" style="margin-top:12px"><button class="btn alt" onclick="closeM()">Cancelar</button><button class="btn" onclick="psave('${s||''}')">Guardar</button></div>`)}
function shrink(file){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=u})}
async function psave(old){const g=id=>$('#f_'+id).value.trim();const sku=g('sku'),name=g('name');
 if(!sku||!name||+g('detal')<=0){alert('SKU, nombre y precio detal son obligatorios.');return}
 if(DB.products.some(p=>p.sku===sku&&p.sku!==old)){alert('Ese SKU ya existe.');return}
 const ca={};for(let n=1;n<=6;n++){const v=+$('#f_c'+n).value;if(v>0)ca[n]=v}
 let p=old?P(old):null;const isNew=!p;if(isNew)p={stock:0,img:''};
 Object.assign(p,{sku,name,brand:g('brand'),cat:$('#f_cat').value,size:g('size'),desc:g('desc'),detal:+g('detal'),mayor:+g('mayor'),min:+g('min'),cost:+g('cost'),soldOut:$('#f_so').checked,active:$('#f_act').checked,cashea:ca,demo:false});
 const fl=$('#f_file').files[0];if(fl)p.img=await shrink(fl);
 if(isNew){DB.products.push(p);const st=+(document.getElementById('f_stock')?.value||0);if(st>0)mv(p,st,'Recepción','Stock inicial')}
 logA('Guardó producto '+sku);save();closeM();adminView()}
function inv(){$('#av').innerHTML=`<div class="panel"><b>Ajuste / recepción</b><label>Producto<select id="ip">${DB.products.map(p=>`<option value="${esc(p.sku)}">${esc(p.sku)} · ${esc(p.name)} (${p.stock})</option>`).join('')}</select></label><label>Cambio (+ recibe / − ajusta)<input type="number" id="ic" step="1"></label><label>Tipo<select id="it"><option>Recepción</option><option>Ajuste</option></select></label><label>Motivo (obligatorio)<input id="ir"></label><p><button class="btn" onclick="iadj()">Aplicar</button></p></div><div class="panel"><b>Historial</b>${movTable(DB.moves.slice().reverse())}</div>`}
function iadj(){const p=P($('#ip').value),c=parseInt($('#ic').value),r=$('#ir').value.trim();
 if(!p||!c||!r){alert('Indica cambio distinto de 0 y motivo.');return}if(p.stock+c<0){alert('El stock no puede quedar negativo.');return}
 if(!confirm(`¿Aplicar ${c>0?'+':''}${c} a ${p.name}?`))return;mv(p,c,$('#it').value,r);logA('Ajuste '+p.sku);save();inv()}
function ords(){$('#av').innerHTML=`<div class="panel"><b>Pedidos</b> <span class="muted">(se guardan al preparar el mensaje de WhatsApp; stock solo se descuenta al confirmar)</span></div>`+(DB.orders.slice().reverse().map(o=>`<div class="panel"><b>#${String(o.id).slice(-6)}</b> · ${new Date(o.date).toLocaleString()} · <b>${o.state}</b><br>${esc(o.name||'Sin nombre')} · ${o.method}${o.form?' · '+esc(o.form):''}${o.lvl?' nivel '+o.lvl:''}<br>${o.items.map(i=>`${esc(i.name)} x${i.q} ${i.sub===null?'(consultar)':money(i.sub)}`).join('<br>')}<br><b>Total estimado ${money(o.total)}</b><div class="row" style="margin-top:8px">
 ${o.state==='preparado'||o.state==='enviado por WhatsApp'?`<button class="btn sm" onclick="oact(${o.id},'confirmar')">Confirmar venta</button><button class="btn sm red" onclick="oact(${o.id},'cancelar')">Cancelar</button>`:''}
 ${o.state==='confirmado'?`<button class="btn sm" onclick="oact(${o.id},'entregar')">Marcar entregado</button><button class="btn sm red" onclick="oact(${o.id},'cancelar')">Cancelar (devuelve stock)</button>`:''}</div></div>`).join('')||'<p class="muted">Aún no hay pedidos.</p>')}
function oact(id,a){const o=DB.orders.find(x=>x.id===id);
 if(a==='confirmar'){if(o.deducted)return;for(const i of o.items){const p=P(i.sku);if(!p||p.stock<i.q){alert('Stock insuficiente para '+i.name);return}}
  if(!confirm('¿Confirmar venta y descontar stock?'))return;o.items.forEach(i=>{const p=P(i.sku);i.cost=p.cost||0;mv(p,-i.q,'Venta','Pedido #'+String(o.id).slice(-6))});o.deducted=true;o.state='confirmado'}
 else if(a==='cancelar'){if(!confirm('¿Cancelar pedido?'))return;if(o.deducted){o.items.forEach(i=>{const p=P(i.sku);if(p)mv(p,i.q,'Devolución','Cancelación #'+String(o.id).slice(-6))});o.deducted=false}o.state='cancelado'}
 else o.state='entregado';logA(a+' pedido '+o.id);save();ords()}
function cats(){$('#av').innerHTML=`<div class="panel"><div class="row"><input id="nc" placeholder="Nueva categoría"><button class="btn" onclick="const v=$('#nc').value.trim();if(v&&!DB.cats.includes(v)){DB.cats.push(v);save();cats()}">Agregar</button></div><table>${DB.cats.map((c,i)=>`<tr><td>${esc(c)}</td><td><button class="btn sm alt" onclick="ren(${i})">Renombrar</button> <button class="btn sm alt" onclick="DB.cats.splice(Math.max(0,i=${i}-1),0,DB.cats.splice(${i},1)[0]);save();cats()">↑</button></td></tr>`).join('')}</table></div>`}
function ren(i){const v=prompt('Nuevo nombre',DB.cats[i]);if(!v)return;DB.products.forEach(p=>{if(p.cat===DB.cats[i])p.cat=v});DB.cats[i]=v;save();cats()}

function mountShow(){const b=document.getElementById('showbox');if(!b)return;
 b.innerHTML='<div class="stage"><div class="pod"></div><div class="orb"><div class="mid pf"><img alt="Perfume destacado" src="'+sImg(0)+'" style="--h:var(--hc)"></div><div class="arm a1"><div class="pf p1"><img alt="Perfume" src="'+sImg(1)+'"></div></div><div class="arm a2"><div class="pf p2"><img alt="Perfume" src="'+sImg(2)+'"></div></div></div></div>'}
function keyBg(cv){const c=cv.getContext('2d'),w=cv.width,h=cv.height,d=c.getImageData(0,0,w,h),a=d.data;const q=(x,y)=>{const i=(y*w+x)*4;return[a[i],a[i+1],a[i+2]]};const r=[q(0,0),q(w-1,0),q(0,h-1),q(w-1,h-1)];const m=[0,1,2].map(k=>r.reduce((t,v)=>t+v[k],0)/4);
 const seen=new Uint8Array(w*h),st=[];for(let x=0;x<w;x++)st.push([x,0],[x,h-1]);for(let y=0;y<h;y++)st.push([0,y],[w-1,y]);
 while(st.length){const[x,y]=st.pop();if(x<0||y<0||x>=w||y>=h)continue;const k=y*w+x;if(seen[k])continue;seen[k]=1;const i=k*4;if(Math.abs(a[i]-m[0])+Math.abs(a[i+1]-m[1])+Math.abs(a[i+2]-m[2])>84)continue;a[i+3]=0;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}
 c.putImageData(d,0,0)}
function readImg(f,key){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,420/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=Math.round(i.width*k);cv.height=Math.round(i.height*k);cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);if(key)keyBg(cv);r(cv.toDataURL('image/webp',.85))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)})}
function showAdm(){const n=['Centro','Giratorio izquierdo','Giratorio derecho'];
 $('#av').innerHTML='<div class="panel"><b>Exhibición de la página principal</b><p class="muted">Tres perfumes: uno al centro y dos que le dan vuelta. Sube una foto de cada uno. Si la foto tiene fondo liso (blanco o negro), marca la casilla y se lo quito.</p><div class="showbox" id="showbox"></div>'+n.map((t,i)=>'<label>'+t+'<input type="file" accept="image/*" id="sf'+i+'"></label>').join('')+'<label><input type="checkbox" id="kb" style="width:auto" checked> Quitar fondo liso automáticamente</label><div class="row" style="margin-top:10px"><button class="btn" onclick="showUp()">Guardar exhibición</button><button class="btn alt" onclick="showReset()">Volver a los originales</button></div></div>';mountShow()}
async function showUp(){const key=$('#kb').checked;DB.show=DB.show||[null,null,null];let ch=0;
 for(let i=0;i<3;i++){const f=$('#sf'+i).files[0];if(!f)continue;if(!f.type.startsWith('image/')){alert('Solo imágenes.');return}const u=await readImg(f,key);if(u){DB.show[i]=u;ch++}}
 if(!ch){alert('Elige al menos una foto.');return}save();logA('Cambió exhibición');mountShow();alert('Listo: la exhibición se actualizó.')}
